[project]
name = "ofapi"
version = "0.1.0"
description = "OpenCTI Connectors Fake APIs for connectors development and testing."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]==0.128.0",
    "factory-boy==3.3.3",
    "httpx==0.28.1",
    "python-multipart>=0.0.21",
    "censys-platform>=0.12.1",
    "pydantic>=2.12.5",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "W191",  # indentation contains tabs
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
docstring-code-format = true

[dependency-groups]
dev = [
    "pre-commit==4.4.0",
    "pytest==9.0.1",
    "ruff==0.14.6",
]
